# 译路畅通 · Nginx 反向代理示例
# 1. 改 server_name 和证书路径
# 2. sudo cp deploy/nginx-ylct.conf /etc/nginx/sites-available/ylct
# 3. sudo ln -s /etc/nginx/sites-available/ylct /etc/nginx/sites-enabled/ylct
# 4. sudo nginx -t && sudo systemctl reload nginx
# 5. sudo certbot --nginx -d your-domain.com

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（后端也会带一份，这里兜底）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # TTS 合成可能较慢，单独放宽超时
    location /api/tts {
        proxy_pass http://127.0.0.1:8818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Service Worker / manifest 不缓存，保证更新能生效
    location = /sw.js {
        proxy_pass http://127.0.0.1:8818;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        proxy_pass http://127.0.0.1:8818;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }

    # 静态资源缓存（可选）
    location ~* \.(png|jpe?g|webp|svg|ico|css|js|woff2?)$ {
        proxy_pass http://127.0.0.1:8818;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }
}
