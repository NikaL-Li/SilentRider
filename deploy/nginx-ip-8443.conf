# 译路畅通 · 无域名部署：Let's Encrypt IP 证书 + 8443
#
# 适用于「服务器有公网 IP、没有可用域名」的情况。
# 2026 年起 Let's Encrypt 支持 IP 证书，但必须是 160 小时短期证书，
# 需要用支持 --cert-profile shortlived 的 ACME 客户端（acme.sh >= 3.1.7）。
#
# 签发示例（80 端口要能访问到 webroot）：
#   acme.sh --issue --server letsencrypt --cert-profile shortlived \
#     -d 117.72.107.56 -w /var/www/html --keylength ec-256
#   acme.sh --install-cert -d 117.72.107.56 --ecc \
#     --key-file /etc/nginx/ssl/ylct-ip/private.key \
#     --fullchain-file /etc/nginx/ssl/ylct-ip/fullchain.cer \
#     --reloadcmd "systemctl reload nginx"
#
# 注意：6666 是 Chrome/Edge 的 unsafe port，浏览器会拒绝访问，不要用。
# 8443 是浏览器允许的常用 HTTPS 端口。

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/ylct-ip/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/ylct-ip/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:YLCT:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;
    access_log /var/log/nginx/ylct.access.log;
    error_log  /var/log/nginx/ylct.error.log;

    location = /sw.js {
        proxy_pass http://127.0.0.1:8818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.json {
        proxy_pass http://127.0.0.1:8818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
    location /api/tts {
        proxy_pass http://127.0.0.1:8818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8818;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
    location ~* \.(png|jpe?g|webp|svg|ico|css|js|woff2?)$ {
        proxy_pass http://127.0.0.1:8818;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
    }
}
